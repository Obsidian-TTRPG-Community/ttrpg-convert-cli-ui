[package]
name = "ttrpg-cli-ui"
version = "2.0.0"
description = "Cross-platform UI for ttrpg-convert-cli"
authors = ["Obsidian TTRPG Community"]
edition = "2021"

[lib]
name = "ttrpg_cli_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["stream"] }
zip = "8"
flate2 = "1"
tar = "0.4"
