name: Release

# Tag-triggered (e.g. `git tag v2.0.0 && git push --tags`).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Use bash on every OS (incl. Git Bash on Windows) so the shell steps match.
defaults:
  run:
    shell: bash

jobs:
  # 1. Gate the release on the test suite.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test

  # 2. Create a DRAFT release with real notes (CHANGELOG section + auto notes).
  create-release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          : > notes.md
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$VER" '
              /^## /  { if (found) exit; if (index($0, ver) > 0) { found = 1; print; next } }
                      { if (found) print }
            ' CHANGELOG.md > section.md || true
            if [ -s section.md ]; then
              cat section.md >> notes.md
              printf "\n\n" >> notes.md
            fi
          fi
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" --jq .body >> notes.md 2>/dev/null || true
          cat >> notes.md <<'EOF'

          ---
          ### Install
          - **Windows** — `.msi` or `.exe`
          - **macOS** — `.dmg` (Apple Silicon and Intel builds provided). If macOS says the app is "damaged" or from an unidentified developer, it's just Gatekeeper quarantining an unsigned download — clear it with: `xattr -cr "/Applications/TTRPG Convert CLI UI.app"` then open normally.
          - **Linux** — `.AppImage` or `.deb`

          On first launch the app downloads the `ttrpg-convert-cli` binary for your OS and you point it at your 5etools data — no Java required.
          EOF
          echo "----- notes -----"; cat notes.md

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          TITLE="TTRPG Convert CLI UI ${TAG}"
          # Tags like v2.0.0-rc2 / v2.1.0-beta are pre-releases.
          PRE=""
          case "$TAG" in *-*) PRE="--prerelease" ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --draft=true --title "$TITLE" --notes-file notes.md $PRE
          else
            gh release create "$TAG" --draft --title "$TITLE" --notes-file notes.md $PRE
          fi

  # 3. Build native installers on each OS and upload them to the draft release.
  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon (arm64)
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest # Intel (x86_64)
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04 # Linux x86_64
            args: "--bundles deb,appimage"
          - platform: windows-latest # Windows x86_64
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Add macOS Rust targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      # Tauri's beforeBuildCommand runs `npm run build` (tsc + vite) for us.
      - name: Build installers
        env:
          # Ad-hoc sign macOS builds ("-") so Gatekeeper shows the recoverable
          # "unidentified developer" gate rather than a hard "damaged" error.
          # Ignored on Linux/Windows.
          APPLE_SIGNING_IDENTITY: "-"
        run: npm run tauri -- build ${{ matrix.args }}

      - name: Upload installers to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          count=$(find src-tauri/target -path "*/release/bundle/*" -type f \
            \( -name "*.dmg" -o -name "*.msi" -o -name "*.exe" -o -name "*.AppImage" -o -name "*.deb" \) | wc -l)
          echo "found $count installer(s)"
          if [ "$count" -eq 0 ]; then
            echo "::error::No installers were produced"; find src-tauri/target -path "*/bundle/*" -type f || true; exit 1
          fi
          find src-tauri/target -path "*/release/bundle/*" -type f \
            \( -name "*.dmg" -o -name "*.msi" -o -name "*.exe" -o -name "*.AppImage" -o -name "*.deb" \) -print0 \
            | xargs -0 -I{} gh release upload "$TAG" "{}" --clobber

  # 4. Publish (un-draft) once every platform build has succeeded.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false
